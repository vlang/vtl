<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">VTL and VSL architecture</title>
  <desc id="desc">VTL data inputs flow through the tensor core into statistics, linear algebra, autograd, and neural network workflows. VSL supplies numerical kernels and dispatches to pure V, CBLAS, CUDA, Vulkan, and OpenCL backends.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17243a" stroke-width="1"/>
    </pattern>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10253d"/>
      <stop offset="1" stop-color="#111b31"/>
    </linearGradient>
    <linearGradient id="tensor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c4b"/>
      <stop offset="1" stop-color="#102e40"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#fbbf24"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
      .eyebrow { fill:#7dd3fc; font-size:13px; font-weight:700; letter-spacing:2.4px; }
      .title { fill:#f8fafc; font-size:34px; font-weight:700; letter-spacing:-.8px; }
      .subtitle { fill:#a8b6ca; font-size:15px; }
      .section { fill:#e2e8f0; font-size:19px; font-weight:700; }
      .label { fill:#f8fafc; font-size:15px; font-weight:700; }
      .body { fill:#c3cfdf; font-size:12.5px; }
      .tiny { fill:#91a2b9; font-size:11px; }
      .chip { fill:#e2e8f0; font-size:12px; font-weight:600; }
      .muted { fill:#71829a; font-size:11px; }
      .box { fill:#0b1424; stroke:#334155; stroke-width:1.5; }
      .divider { stroke:#334155; stroke-width:1; }
      .arrow { fill:none; stroke:#38bdf8; stroke-width:2.5; marker-end:url(#arrow-cyan); }
      .arrow-back { fill:none; stroke:#a78bfa; stroke-width:2.2; marker-end:url(#arrow-violet); }
      .arrow-dispatch { fill:none; stroke:#fbbf24; stroke-width:2.2; marker-end:url(#arrow-amber); }
    </style>
  </defs>

  <rect width="1440" height="940" rx="22" fill="#050b16"/>
  <rect width="1440" height="940" rx="22" fill="url(#grid)" opacity=".58"/>
  <rect x="1" y="1" width="1438" height="938" rx="21" fill="none" stroke="#26364c" stroke-width="2"/>

  <g>
    <text x="64" y="56" class="eyebrow">NUMERICAL COMPUTING · MACHINE LEARNING · V</text>
    <text x="64" y="103" class="title">How VTL and VSL work together</text>
    <text x="64" y="132" class="subtitle">One tensor API from data ingestion through differentiable models to CPU and accelerator kernels.</text>
    <rect x="1191" y="47" width="185" height="38" rx="19" fill="#0d1d2c" stroke="#155e75"/>
    <circle cx="1212" cy="66" r="5" fill="#34d399"/>
    <text x="1227" y="70" class="chip">VTL + VSL</text>
  </g>

  <!-- Flow arrows are drawn before the component cards. -->
  <path d="M304 376H350V463H386" class="arrow"/>
  <path d="M1050 465H1094V376H1132" class="arrow"/>
  <path d="M706 334V370" class="arrow"/>
  <path d="M706 584V624" class="arrow-back"/>
  <path d="M706 763V810" class="arrow-dispatch"/>
  <path d="M1034 693H1085V523H1132" class="arrow-back"/>

  <!-- Inputs -->
  <g>
    <rect x="64" y="190" width="240" height="496" rx="14" fill="#0b1424" stroke="#64748b" stroke-width="1.5"/>
    <rect x="64" y="190" width="240" height="54" rx="14" fill="#101b2c"/>
    <path d="M64 230V244H304V230" fill="#101b2c"/>
    <circle cx="88" cy="217" r="6" fill="#94a3b8"/>
    <text x="106" y="223" class="section">Inputs</text>
    <text x="84" y="276" class="tiny">DATA ENTERS AS TENSORS</text>
    <rect x="82" y="296" width="204" height="82" rx="9" fill="#111d2e" stroke="#475569"/>
    <text x="101" y="324" class="label">Creation</text>
    <text x="101" y="348" class="body">arrays · ranges · random</text>
    <text x="101" y="366" class="body">broadcastable shapes</text>
    <rect x="82" y="394" width="204" height="104" rx="9" fill="#111d2e" stroke="#475569"/>
    <text x="101" y="422" class="label">Files</text>
    <text x="101" y="447" class="body">CSV · .npy · .npz</text>
    <text x="101" y="470" class="body">typed arrays · named members</text>
    <rect x="82" y="514" width="204" height="112" rx="9" fill="#111d2e" stroke="#475569"/>
    <text x="101" y="543" class="label">Data pipelines</text>
    <text x="101" y="568" class="body">datasets · batches</text>
    <text x="101" y="591" class="body">transforms · shuffling</text>
    <text x="84" y="660" class="muted">vlang/vtl</text>
  </g>

  <!-- VTL high-level API -->
  <g>
    <rect x="386" y="190" width="648" height="144" rx="14" fill="url(#header)" stroke="#22d3ee" stroke-width="1.8"/>
    <text x="412" y="222" class="eyebrow">VTL · PUBLIC WORKFLOWS</text>
    <text x="412" y="251" class="section">Compose numerical and learning workloads</text>
    <rect x="412" y="270" width="132" height="42" rx="8" fill="#102b3a" stroke="#0e7490"/>
    <text x="478" y="296" class="chip" text-anchor="middle">Statistics</text>
    <rect x="553" y="270" width="128" height="42" rx="8" fill="#102b3a" stroke="#0e7490"/>
    <text x="617" y="296" class="chip" text-anchor="middle">Linear algebra</text>
    <rect x="690" y="270" width="112" height="42" rx="8" fill="#102b3a" stroke="#0e7490"/>
    <text x="746" y="296" class="chip" text-anchor="middle">Autograd</text>
    <rect x="811" y="270" width="197" height="42" rx="8" fill="#102b3a" stroke="#0e7490"/>
    <text x="909" y="296" class="chip" text-anchor="middle">Neural networks</text>
  </g>

  <!-- Tensor core -->
  <g>
    <rect x="386" y="370" width="648" height="214" rx="16" fill="url(#tensor)" stroke="#34d399" stroke-width="2"/>
    <text x="412" y="406" class="eyebrow" style="fill:#6ee7b7">VTL · TENSOR CORE</text>
    <text x="412" y="438" class="section">Tensor[T]</text>
    <text x="531" y="438" class="body">n-dimensional data · explicit dtype · shared storage</text>
    <line x1="412" y1="458" x2="1008" y2="458" class="divider"/>
    <rect x="412" y="479" width="179" height="76" rx="9" fill="#0d2631" stroke="#276749"/>
    <text x="431" y="505" class="label">Shape &amp; views</text>
    <text x="431" y="529" class="body">strides · slicing</text>
    <text x="431" y="547" class="body">reshape · transpose</text>
    <rect x="604" y="479" width="179" height="76" rx="9" fill="#0d2631" stroke="#276749"/>
    <text x="623" y="505" class="label">Array operations</text>
    <text x="623" y="529" class="body">broadcast · index</text>
    <text x="623" y="547" class="body">math · masks · reduce</text>
    <rect x="796" y="479" width="212" height="76" rx="9" fill="#0d2631" stroke="#276749"/>
    <text x="815" y="505" class="label">Compute graph</text>
    <text x="815" y="529" class="body">gradient tracking</text>
    <text x="815" y="547" class="body">differentiable operations</text>
  </g>

  <!-- VSL -->
  <g>
    <rect x="386" y="624" width="648" height="139" rx="14" fill="#17122b" stroke="#a78bfa" stroke-width="1.8"/>
    <text x="412" y="657" class="eyebrow" style="fill:#c4b5fd">VSL · SCIENTIFIC COMPUTING</text>
    <text x="412" y="687" class="section">Backend-dispatched numerical kernels</text>
    <rect x="412" y="707" width="132" height="36" rx="8" fill="#211b39" stroke="#6d5ba6"/>
    <text x="478" y="730" class="chip" text-anchor="middle">BLAS / LAPACK</text>
    <rect x="553" y="707" width="104" height="36" rx="8" fill="#211b39" stroke="#6d5ba6"/>
    <text x="605" y="730" class="chip" text-anchor="middle">FFT</text>
    <rect x="666" y="707" width="104" height="36" rx="8" fill="#211b39" stroke="#6d5ba6"/>
    <text x="718" y="730" class="chip" text-anchor="middle">SIMD</text>
    <rect x="779" y="707" width="229" height="36" rx="8" fill="#211b39" stroke="#6d5ba6"/>
    <text x="893" y="730" class="chip" text-anchor="middle">GPU compute &amp; device memory</text>
  </g>

  <!-- Execution backends -->
  <g>
    <rect x="386" y="810" width="648" height="83" rx="14" fill="#241a0d" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="410" y="840" class="eyebrow" style="fill:#fcd34d">EXECUTION TARGETS</text>
    <rect x="410" y="852" width="118" height="27" rx="13.5" fill="#33240f" stroke="#a16207"/>
    <text x="469" y="870" class="chip" text-anchor="middle">Pure V · CPU</text>
    <rect x="537" y="852" width="130" height="27" rx="13.5" fill="#33240f" stroke="#a16207"/>
    <text x="602" y="870" class="chip" text-anchor="middle">CBLAS · LAPACK</text>
    <rect x="676" y="852" width="95" height="27" rx="13.5" fill="#33240f" stroke="#a16207"/>
    <text x="723" y="870" class="chip" text-anchor="middle">CUDA</text>
    <rect x="780" y="852" width="105" height="27" rx="13.5" fill="#33240f" stroke="#a16207"/>
    <text x="832" y="870" class="chip" text-anchor="middle">Vulkan</text>
    <rect x="894" y="852" width="114" height="27" rx="13.5" fill="#33240f" stroke="#a16207"/>
    <text x="951" y="870" class="chip" text-anchor="middle">OpenCL · VCL</text>
  </g>

  <!-- Results -->
  <g>
    <rect x="1132" y="190" width="244" height="496" rx="14" fill="#0b1424" stroke="#64748b" stroke-width="1.5"/>
    <rect x="1132" y="190" width="244" height="54" rx="14" fill="#101b2c"/>
    <path d="M1132 230V244H1376V230" fill="#101b2c"/>
    <circle cx="1156" cy="217" r="6" fill="#94a3b8"/>
    <text x="1174" y="223" class="section">Results</text>
    <text x="1152" y="276" class="tiny">VALUES FLOW BACK TO APPS</text>
    <rect x="1150" y="296" width="208" height="82" rx="9" fill="#111d2e" stroke="#475569"/>
    <text x="1169" y="324" class="label">Analysis</text>
    <text x="1169" y="348" class="body">statistics · transforms</text>
    <text x="1169" y="366" class="body">visualization · metrics</text>
    <rect x="1150" y="394" width="208" height="104" rx="9" fill="#111d2e" stroke="#475569"/>
    <text x="1169" y="422" class="label">Learning</text>
    <text x="1169" y="447" class="body">predictions · gradients</text>
    <text x="1169" y="470" class="body">models · checkpoints</text>
    <rect x="1150" y="514" width="208" height="112" rx="9" fill="#111d2e" stroke="#475569"/>
    <text x="1169" y="543" class="label">Interchange</text>
    <text x="1169" y="568" class="body">CSV · .npy · .npz</text>
    <text x="1169" y="591" class="body">CPU and device tensors</text>
    <text x="1152" y="660" class="muted">VTL · VSL · applications</text>
  </g>

  <!-- Legend and footer -->
  <g transform="translate(64 912)">
    <circle cx="5" cy="0" r="5" fill="#38bdf8"/><text x="18" y="4" class="tiny">VTL workflows</text>
    <circle cx="153" cy="0" r="5" fill="#34d399"/><text x="166" y="4" class="tiny">tensor core</text>
    <circle cx="282" cy="0" r="5" fill="#a78bfa"/><text x="295" y="4" class="tiny">VSL kernels</text>
    <circle cx="430" cy="0" r="5" fill="#fbbf24"/><text x="443" y="4" class="tiny">execution backends</text>
    <text x="1376" y="4" class="muted" text-anchor="end">VTL / VSL architecture</text>
  </g>
</svg>
