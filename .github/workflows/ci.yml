name: Continuous Integration

env:
  VJOBS: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Main pushes are serialized to the newest revision, so rapid merges do not
  # leave stale workflows occupying the Actions queue.
  cancel-in-progress: true

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: '31 1,12 * * *'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!.github/workflows/ci.yml'
      - '!.github/workflows/ci-full-ml.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!.github/workflows/ci.yml'
      - '!.github/workflows/ci-full-ml.yml'

jobs:
  shellcheck:
    name: Shellcheck
    uses: ./.github/workflows/shellcheck.yml

  todo:
    if: github.event_name == 'push'
    name: TODO
    uses: ./.github/workflows/todo.yml

  fmt-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        id: checkout_vtl
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Setup V
        id: setup_v
        if: ${{ success() && !cancelled() && steps.checkout_vtl.outcome == 'success' }}
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move VTL source code to V Modules
        id: move_vtl_source_code_to_v_modules
        if: ${{ success() && !cancelled() && steps.setup_v.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl

      - name: V doctor
        id: v_doctor
        if: ${{ success() && !cancelled() && steps.move_vtl_source_code_to_v_modules.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor
          else
            v doctor
          fi

      - name: Install dependencies
        id: install_dependencies
        if: ${{ success() && !cancelled() && steps.v_doctor.outcome == 'success' }}
        run: |
          sudo apt-get -qq update && \
          sudo apt-get -qq install \
            gfortran \
            libxi-dev \
            libxcursor-dev \
            mesa-common-dev \
            liblapacke-dev \
            libopenblas-dev \
            libgc-dev \
            libgl1-mesa-dev \
            libopenmpi-dev \
            libhdf5-dev \
            hdf5-tools \
            opencl-headers

      - name: Verify Fmt
        id: verify_fmt
        if: ${{ success() && !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            env HOME="$HOME" PATH="$PATH" VJOBS=2 v fmt -verify vtl
          else
            v fmt -verify vtl
          fi

  run-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      matrix:
        # Exercise both supported Linux releases, pure-V, CBLAS, LAPACKE, an
        # optimized pure-V build, and macOS without running the full cross product.
        include:
          - os: ubuntu-22.04
            flags: ''
            backend: pure-v
          - os: ubuntu-24.04
            flags: ''
            backend: pure-v
          - os: ubuntu-24.04
            flags: ''
            backend: cblas
          - os: ubuntu-24.04
            flags: ''
            backend: lapacke
          - os: ubuntu-24.04
            flags: '--prod'
            backend: pure-v
          - os: macos-14
            flags: ''
            backend: pure-v
      fail-fast: false

    env:
      # Fixes complaints about $TERM not being set when running the vtl test script
      # (a warning on Linux, but an error on macOS).
      TERM: xterm
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        id: checkout_vtl
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        id: checkout_vsl
        if: ${{ success() && !cancelled() && steps.checkout_vtl.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Setup V
        id: setup_v
        if: ${{ success() && !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move VTL source code to V Modules
        id: move_vtl_source_code_to_v_modules
        if: ${{ success() && !cancelled() && steps.setup_v.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        id: v_doctor
        if: ${{ success() && !cancelled() && steps.move_vtl_source_code_to_v_modules.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor
          else
            v doctor
          fi

      - name: Install dependencies
        id: install_dependencies
        if: ${{ success() && !cancelled() && steps.v_doctor.outcome == 'success' }}
        run: |
          if [ $RUNNER_OS == 'Linux' ]; then
            sudo apt -qq update
            sudo apt -qq install \
              gfortran \
              libxi-dev \
              libxcursor-dev \
              mesa-common-dev \
              liblapacke-dev \
              libopenblas-dev \
              libgc-dev \
              libgl1-mesa-dev \
              libopenmpi-dev \
              libhdf5-dev \
              hdf5-tools \
              opencl-headers
          else
            brew install coreutils hdf5 open-mpi openblas lapack opencl-headers
          fi

      - name: Execute Tests
        id: execute_tests
        if: ${{ success() && !cancelled() && steps.install_dependencies.outcome == 'success' }}
        env:
          VJOBS: '2'
        run: |
          cd ~/.vmodules
          if [[ "${{ matrix.backend }}" == "cblas" ]]; then
            backend_flag=--use-cblas
          elif [[ "${{ matrix.backend }}" == "lapacke" ]]; then
            backend_flag=--use-lapacke
          fi
          # Default: scoped tests + tiny_synth smoke (see bin/test, issue #109)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
              "$HOME/.vmodules/vtl/bin/test" ${{ matrix.flags }} $backend_flag
          else
            ~/.vmodules/vtl/bin/test ${{ matrix.flags }} $backend_flag
          fi

  opencl-vcl-smoke:
    name: OpenCL/VCL tensor smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        id: checkout_vtl
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        id: checkout_vsl
        if: ${{ success() && !cancelled() && steps.checkout_vtl.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Setup V
        id: setup_v
        if: ${{ success() && !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move modules to V Modules
        id: move_modules_to_v_modules
        if: ${{ success() && !cancelled() && steps.setup_v.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        id: v_doctor
        if: ${{ success() && !cancelled() && steps.move_modules_to_v_modules.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor

      - name: Install OpenCL CPU runtime
        id: install_opencl_cpu_runtime
        if: ${{ success() && !cancelled() && steps.v_doctor.outcome == 'success' }}
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install opencl-headers ocl-icd-opencl-dev pocl-opencl-icd

      - name: Run VTL OpenCL/VCL smoke
        id: run_vtl_opencl_vcl_smoke
        if: ${{ success() && !cancelled() && steps.install_opencl_cpu_runtime.outcome == 'success' }}
        env:
          VJOBS: '2'
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v -d vcl run vtl/examples/vtl_opencl_vcl_support/main.v

  vulkan-activation-smoke:
    name: Vulkan activation kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        id: checkout_vtl
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        id: checkout_vsl
        if: ${{ success() && !cancelled() && steps.checkout_vtl.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Setup V
        id: setup_v
        if: ${{ success() && !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move modules to V Modules
        id: move_modules_to_v_modules
        if: ${{ success() && !cancelled() && steps.setup_v.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: Install Vulkan runtime and headers
        id: install_vulkan_runtime_and_headers
        if: ${{ success() && !cancelled() && steps.move_modules_to_v_modules.outcome == 'success' }}
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install libvulkan-dev mesa-vulkan-drivers vulkan-tools

      - name: Run Vulkan activation layer tests
        id: run_vulkan_activation_layer_tests
        if: ${{ success() && !cancelled() && steps.install_vulkan_runtime_and_headers.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" \
            env VJOBS=2 vulkaninfo --summary
          env HOME="$HOME" PATH="$PATH" VTL_USE_VULKAN=1 \
            env VJOBS=2 VTL_USE_VULKAN=1 v -d vulkan test \
            ./vtl/nn/layers/activation_vulkan_extra_f32_d_vulkan_test.v

  windows-smoke:
    name: Windows core and autograd tests
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Stop a failing test session at its first failure instead of
      # running the whole suite to completion; the remaining files
      # add no signal.
      VTEST_FAIL_FAST: '1'
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        id: checkout_vtl
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        id: checkout_vsl
        if: ${{ success() && !cancelled() && steps.checkout_vtl.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Checkout V compiler source
        id: checkout_v_compiler_source
        if: ${{ success() && !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/v
          ref: master
          path: v

      - name: Checkout V Windows bootstrap source
        id: checkout_v_windows_bootstrap_source
        if: ${{ success() && !cancelled() && steps.checkout_v_compiler_source.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/vc
          ref: master
          path: v/vc

      - name: Checkout bundled Windows TCC
        id: checkout_bundled_windows_tcc
        if: ${{ success() && !cancelled() && steps.checkout_v_windows_bootstrap_source.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/tccbin
          ref: thirdparty-windows-amd64
          path: v/thirdparty/tcc

      - name: Build current V compiler (Windows)
        id: build_current_v_compiler_windows
        if: ${{ success() && !cancelled() && steps.checkout_bundled_windows_tcc.outcome == 'success' }}
        shell: pwsh
        run: |
          # Use V's Windows bootstrap so it supports current VTL syntax.
          Push-Location v
          try {
            # The published vc snapshot declares these helpers but does not
            # define them yet. Reuse their implementations from current V.
            $vcFile = Join-Path (Get-Location).Path 'vc/v_win.c'
            $source = [IO.File]::ReadAllText($vcFile)
            $helperNames = @(
              'v3_win_thread_create',
              'v3_win_thread_is_current',
              'v3_win_thread_join',
              'v_time_ticks_ms',
              'v_toolcache_close_handle',
              'v_toolcache_create_file_w',
              'v_toolcache_file_is_disk',
              'v_toolcache_get_file_information',
              'v_toolcache_move_file_ex_w',
              'v_toolcache_read_file',
              'v_toolcache_root_is_private'
            )
            $namePattern = $helperNames -join '|'
            $definitionPattern = (
              '(?m)^(?:static\s+)?(?:inline\s+)?(?:void\*|int|u64)\s+'
            ) + "($namePattern)\([^;{}]*\)\s*\{"
            $definitions = [regex]::Matches($source, $definitionPattern).Count
            if ($definitions -eq 0) {
              $prototypePattern = (
                '(?m)^(void\*|int|u64) (' + $namePattern +
                ')\(([^\r\n;]*)\);(\r?)$'
              )
              $prototypes = [regex]::Matches($source, $prototypePattern).Count
              if ($prototypes -ne $helperNames.Count) {
                throw "Expected 11 V helper declarations, found $prototypes"
              }
              $source = [regex]::Replace(
                $source,
                $prototypePattern,
                'static $1 $2($3);$4'
              )
              $marker = '#include <windows.h>'
              $markerIndex = $source.IndexOf($marker)
              if ($markerIndex -lt 0) {
                throw 'Could not find the Windows header in vc/v_win.c'
              }
              $includeAt = $source.IndexOf("`n", $markerIndex)
              if ($includeAt -lt 0) {
                throw 'Could not find the Windows header line ending'
              }
              $headers = @(
                '#include "../cmd/v/toolcache_windows_helpers.h"',
                '#include "../vlib/time/ticks_windows.h"',
                '#include "../vlib/v/winthread_helper.h"'
              ) -join "`r`n"
              $source = $source.Insert($includeAt + 1, "$headers`r`n")
              [IO.File]::WriteAllText(
                $vcFile,
                $source,
                [System.Text.UTF8Encoding]::new($false)
              )
            } elseif ($definitions -ne $helperNames.Count) {
              throw "Found a partial V helper implementation set: $definitions"
            }
            $bootstrap = 'makev.bat -msvc --local && ' +
              'v.exe -o v2.exe cmd/v && v2.exe -showcc -o v.exe cmd/v'
            cmd /c $bootstrap
            if ($LASTEXITCODE -ne 0) {
              throw "V bootstrap failed with exit code $LASTEXITCODE"
            }
            $vDirectory = (Get-Location).Path
            Add-Content -Path $env:GITHUB_PATH -Value $vDirectory
            & (Join-Path $vDirectory 'v.exe') version
          }
          finally {
            Pop-Location
          }

      - name: Move VTL source code to V Modules
        id: move_vtl_source_code_to_v_modules
        if: ${{ success() && !cancelled() && steps.build_current_v_compiler_windows.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        id: v_doctor
        if: ${{ success() && !cancelled() && steps.move_vtl_source_code_to_v_modules.outcome == 'success' }}
        shell: bash
        run: |
          cd ~/.vmodules
          v doctor

      - name: Run Windows core tensor tests
        id: run_windows_core_tensor_tests
        if: ${{ success() && !cancelled() && steps.v_doctor.outcome == 'success' }}
        shell: bash
        run: |
          cd ~/.vmodules
          v test vtl/tests/core

      - name: Run Windows autograd gate tests
        id: run_windows_autograd_gate_tests
        if: ${{ success() && !cancelled() && steps.run_windows_core_tensor_tests.outcome == 'success' }}
        shell: bash
        run: |
          cd ~/.vmodules
          v test vtl/autograd_tests
