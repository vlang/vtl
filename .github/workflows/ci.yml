name: Continuous Integration

env:
  VJOBS: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Main pushes are serialized to the newest revision, so rapid merges do not
  # leave stale workflows occupying the Actions queue.
  cancel-in-progress: true

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  schedule:
    - cron: '31 1,12 * * *'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!.github/workflows/ci.yml'
      - '!.github/workflows/ci-full-ml.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.yml'
      - '!.github/workflows/ci.yml'
      - '!.github/workflows/ci-full-ml.yml'

jobs:
  shellcheck:
    name: Shellcheck
    uses: ./.github/workflows/shellcheck.yml

  todo:
    if: github.event_name == 'push'
    name: TODO
    uses: ./.github/workflows/todo.yml

  fmt-check:
    runs-on: ubuntu-latest
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Setup V
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move VTL source code to V Modules
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl

      - name: V doctor
        run: |
          cd ~/.vmodules
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor
          else
            v doctor
          fi

      - name: Install dependencies
        run: |
          sudo apt-get -qq update && \
          sudo apt-get -qq install \
            gfortran \
            libxi-dev \
            libxcursor-dev \
            mesa-common-dev \
            liblapacke-dev \
            libopenblas-dev \
            libgc-dev \
            libgl1-mesa-dev \
            libopenmpi-dev \
            libhdf5-dev \
            hdf5-tools \
            opencl-headers

      - name: Verify Fmt
        run: |
          cd ~/.vmodules
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            env HOME="$HOME" PATH="$PATH" VJOBS=2 v fmt -verify vtl
          else
            v fmt -verify vtl
          fi

  run-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # Exercise both supported Linux releases, pure-V, CBLAS, LAPACKE, an
        # optimized pure-V build, and macOS without running the full cross product.
        include:
          - os: ubuntu-22.04
            flags: ''
            backend: pure-v
          - os: ubuntu-24.04
            flags: ''
            backend: pure-v
          - os: ubuntu-24.04
            flags: ''
            backend: cblas
          - os: ubuntu-24.04
            flags: ''
            backend: lapacke
          - os: ubuntu-24.04
            flags: '--prod'
            backend: pure-v
          - os: macos-14
            flags: ''
            backend: pure-v
      fail-fast: false

    env:
      # Fixes complaints about $TERM not being set when running the vtl test script
      # (a warning on Linux, but an error on macOS).
      TERM: xterm
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move VTL source code to V Modules
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        run: |
          cd ~/.vmodules
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor
          else
            v doctor
          fi

      - name: Install dependencies
        run: |
          if [ $RUNNER_OS == 'Linux' ]; then
            sudo apt -qq update
            sudo apt -qq install \
              gfortran \
              libxi-dev \
              libxcursor-dev \
              mesa-common-dev \
              liblapacke-dev \
              libopenblas-dev \
              libgc-dev \
              libgl1-mesa-dev \
              libopenmpi-dev \
              libhdf5-dev \
              hdf5-tools \
              opencl-headers
          else
            brew install coreutils hdf5 open-mpi openblas lapack opencl-headers
          fi

      - name: Execute Tests
        env:
          VJOBS: '2'
        run: |
          cd ~/.vmodules
          if [[ "${{ matrix.backend }}" == "cblas" ]]; then
            backend_flag=--use-cblas
          elif [[ "${{ matrix.backend }}" == "lapacke" ]]; then
            backend_flag=--use-lapacke
          fi
          # Default: scoped tests + tiny_synth smoke (see bin/test, issue #109)
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
              "$HOME/.vmodules/vtl/bin/test" ${{ matrix.flags }} $backend_flag
          else
            ~/.vmodules/vtl/bin/test ${{ matrix.flags }} $backend_flag
          fi

  opencl-vcl-smoke:
    name: OpenCL/VCL tensor smoke
    runs-on: ubuntu-24.04
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move modules to V Modules
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor

      - name: Install OpenCL CPU runtime
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install opencl-headers ocl-icd-opencl-dev pocl-opencl-icd

      - name: Run VTL OpenCL/VCL smoke
        env:
          VJOBS: '2'
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v -d vcl run vtl/examples/vtl_opencl_vcl_support/main.v

  vulkan-activation-smoke:
    name: Vulkan activation kernels
    runs-on: ubuntu-24.04
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Move modules to V Modules
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: Install Vulkan runtime and headers
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install libvulkan-dev mesa-vulkan-drivers vulkan-tools

      - name: Run Vulkan activation layer tests
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" \
            env VJOBS=2 vulkaninfo --summary
          env HOME="$HOME" PATH="$PATH" VTL_USE_VULKAN=1 \
            env VJOBS=2 VTL_USE_VULKAN=1 v -d vulkan test \
            ./vtl/nn/layers/activation_vulkan_extra_f32_d_vulkan_test.v

  windows-smoke:
    name: Windows core and autograd tests
    runs-on: windows-latest
    env:
      VJOBS: '2'

    steps:
      - name: Checkout VTL
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Install official V release binary (Windows)
        shell: pwsh
        run: |
          # setup-v's source bootstrap currently fails on Windows.
          # Use the official release binary and verify its pinned digest.
          $version = '0.5.2'
          $expectedSha256 = (
            '5f1d619b6b04a2b54b4ad21826a25bdc' +
            'ba2acf75a941c8f72fc95672b6b064ca'
          )
          $archive = Join-Path $env:RUNNER_TEMP 'v_windows.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'vlang'
          $releaseUri = "https://github.com/vlang/v/releases/download/$version"
          $uri = "$releaseUri/v_windows.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $archiveHash = Get-FileHash -Path $archive -Algorithm SHA256
          $actualSha256 = $archiveHash.Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "V archive SHA-256 mismatch: $actualSha256"
          }
          Expand-Archive -LiteralPath $archive `
            -DestinationPath $installRoot -Force
          $vDirectory = Join-Path $installRoot 'v'
          if (-not (Test-Path (Join-Path $vDirectory 'v.exe'))) {
            throw 'The official V release archive does not contain v.exe'
          }
          $vDirectory | Out-File -FilePath $env:GITHUB_PATH `
            -Append -Encoding utf8
          $vExecutable = Join-Path $vDirectory 'v.exe'
          & $vExecutable version

      - name: Move VTL source code to V Modules
        shell: bash
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: V doctor
        shell: bash
        run: |
          cd ~/.vmodules
          v doctor

      - name: Run Windows core tensor tests
        shell: bash
        run: |
          cd ~/.vmodules
          v test vtl/tests/core

      - name: Run Windows autograd gate tests
        shell: bash
        run: |
          cd ~/.vmodules
          v test vtl/autograd_tests
