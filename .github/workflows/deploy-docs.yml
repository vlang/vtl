name: Deploy Documentation

env:
  VJOBS: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - '**.v'
      - '**.md'
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    env:
      VJOBS: '2'
    steps:
      - name: Checkout vtl
        uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Setup V
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Copy modules to V Modules
        run: |
          mkdir -p ~/.vmodules
          cp -a ./vtl ~/.vmodules/vtl
          cp -a ./vsl ~/.vmodules/vsl

      - name: V doctor
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 v doctor

      - name: Build docs
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v doc -readme -m -f html ./vtl

      - name: Stage website and generated API docs
        run: |
          rm -rf ./vtl/_site
          mkdir -p ./vtl/_site/api
          cp -a ./vtl/website/. ./vtl/_site/
          cp -a ~/.vmodules/vtl/_docs/. ./vtl/_site/api/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./vtl/_site/
