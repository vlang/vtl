name: Docs Check

env:
  VJOBS: '2'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.github/workflows/docs-check.yml'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/docs-check.yml'

jobs:
  check-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VJOBS: '2'
    steps:
      - name: Checkout VTL
        id: checkout_vtl
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: vtl

      - name: Checkout VSL
        id: checkout_vsl
        if: ${{ !cancelled() && steps.checkout_vtl.outcome == 'success' }}
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - name: Setup V
        id: setup_v
        if: ${{ !cancelled() && steps.checkout_vsl.outcome == 'success' }}
        uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        with:
          check-latest: true

      - name: Copy VTL source code to V Modules
        id: copy_vtl_source_code_to_v_modules
        if: ${{ !cancelled() && steps.setup_v.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          cp -rf ./vtl ~/.vmodules/vtl
          cp -rf ./vsl ~/.vmodules/vsl

      - name: Detect changed Markdown
        if: ${{ !cancelled() && steps.copy_vtl_source_code_to_v_modules.outcome == 'success' }}
        id: markdown
        run: |
          cd vtl
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
            files="$(git ls-files '*.md')"
          else
            files="$(git diff --name-only --diff-filter=ACMR "${base}" HEAD -- '*.md')"
          fi

          {
            echo 'files<<EOF'
            echo "${files}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Validate changed Markdown
        if: steps.markdown.outputs.files != ''
        env:
          MARKDOWN_FILES: ${{ steps.markdown.outputs.files }}
        run: |
          cd ~/.vmodules
          mapfile -t markdown_files <<< "$MARKDOWN_FILES"
          env HOME="$HOME" PATH="$PATH" VJOBS=2 \
            v check-md -hide-warnings "${markdown_files[@]}"

      - name: Skip when no Markdown changed
        if: steps.markdown.outputs.files == ''
        run: echo "No Markdown files changed."
