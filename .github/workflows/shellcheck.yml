name: Shellcheck

on:
  workflow_call:

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Begin CI...
        id: begin_ci
        uses: actions/checkout@v3
      - name: Run ShellCheck
        id: run_shellcheck
        if: ${{ success() && !cancelled() && steps.begin_ci.outcome == 'success' }}
        uses: ludeeus/action-shellcheck@1.1.0
        with:
          severity: error
