name: vs NumPy PR comment

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/**/*.v'
      - 'benchmarks/**/*.py'
      - '*.v'
      - 'nn/**/*.v'
      - 'stats/**/*.v'
      - 'fft/**/*.v'
      - 'storage/**/*.v'
      - 'npy/**/*.v'
      - 'npz/**/*.v'
      - '.github/workflows/benchmark-pr-comment.yml'

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-24.04
    env:
      VJOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - uses: vlang/setup-v@v1.6
        with:
          check-latest: true

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libopenblas-dev liblapacke-dev gfortran python3 python3-numpy

      - name: Install module
        run: |
          mkdir -p ~/.vmodules
          cp -rf ./vsl ~/.vmodules/vsl
          cp -rf ./vtl ~/.vmodules/vtl

      - name: Run vs NumPy harness
        run: |
          set -euo pipefail
          cd ~/.vmodules
          {
            echo '## VTL vs NumPy (CPU matmul via VSL CBLAS)'
            sudo systemd-run --scope --wait --property=MemoryMax=2G --property=MemorySwapMax=0 --setenv=HOME=$HOME --setenv=PATH=$PATH --setenv=VJOBS=2 --setenv=OPENBLAS_NUM_THREADS=2 -- v -d vsl_blas_cblas -prod run vtl/benchmarks/vs_numpy/matmul_bench.v
            sudo systemd-run --scope --wait --property=MemoryMax=1G --property=MemorySwapMax=0 --setenv=HOME=$HOME --setenv=PATH=$PATH --setenv=VJOBS=2 --setenv=OPENBLAS_NUM_THREADS=2 -- python3 vtl/benchmarks/vs_numpy/numpy_matmul_baseline.py
            sudo systemd-run --scope --wait --property=MemoryMax=1G --property=MemorySwapMax=0 --setenv=HOME=$HOME --setenv=PATH=$PATH --setenv=VJOBS=2 --setenv=OPENBLAS_NUM_THREADS=2 -- python3 vtl/benchmarks/vs_numpy/numpy_matmul_f32_end_to_end.py
            sudo systemd-run --scope --wait --property=MemoryMax=2G --property=MemorySwapMax=0 --setenv=HOME=$HOME --setenv=PATH=$PATH --setenv=VJOBS=2 -- v -prod run vtl/benchmarks/vs_numpy/conv2d_bench.v
            echo '## Contiguous sum and mean'
            sudo systemd-run --scope --wait --property=MemoryMax=2G --property=MemorySwapMax=0 --setenv=HOME=$HOME --setenv=PATH=$PATH --setenv=VJOBS=2 -- v -prod run vtl/benchmarks/vs_numpy/stats_bench.v
            sudo systemd-run --scope --wait --property=MemoryMax=1G --property=MemorySwapMax=0 --setenv=HOME=$HOME --setenv=PATH=$PATH --setenv=VJOBS=2 -- python3 vtl/benchmarks/vs_numpy/numpy_stats_baseline.py
          } 2>&1 | tee vs_numpy_pr.md

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vtl-vs-numpy
          path: ~/.vmodules/vs_numpy_pr.md
