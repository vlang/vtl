name: vs NumPy PR comment

env:
  VJOBS: '2'

on:
  pull_request:
    branches: [main]
    paths:
      - 'benchmarks/**/*.v'
      - 'benchmarks/**/*.py'
      - '*.v'
      - 'nn/**/*.v'
      - 'la/**/*.v'
      - 'stats/**/*.v'
      - 'fft/**/*.v'
      - 'storage/**/*.v'
      - 'npy/**/*.v'
      - 'npz/**/*.v'
      - '.github/workflows/benchmark-pr-comment.yml'

permissions:
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-24.04
    env:
      VJOBS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          path: vtl

      - name: Checkout VSL
        uses: actions/checkout@v4
        with:
          repository: vlang/vsl
          path: vsl

      - uses: vlang/setup-v@v1.6
        with:
          check-latest: true

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libopenblas-dev liblapacke-dev gfortran python3 python3-numpy

      - name: Install module
        run: |
          mkdir -p ~/.vmodules
          cp -rf ./vsl ~/.vmodules/vsl
          cp -rf ./vtl ~/.vmodules/vtl

      - name: Run vs NumPy harness
        run: |
          set -euo pipefail
          cd ~/.vmodules
          run_v_benchmark() {
            local name="$1"
            local source="$2"
            shift 2
            local binary="/tmp/${name}"
            env HOME="$HOME" PATH="$PATH" VJOBS=2 OPENBLAS_NUM_THREADS=2 v -no-parallel -cc gcc -prod \
              -cflags "-march=native" "$@" -o "$binary" "$source"
            env HOME="$HOME" PATH="$PATH" VJOBS=2 OPENBLAS_NUM_THREADS=2 "$binary"
          }
          {
            echo '## VTL vs NumPy (CPU matmul via VSL CBLAS)'
            run_v_benchmark vtl-matmul vtl/benchmarks/vs_numpy/matmul_bench.v -d vsl_blas_cblas
            env HOME="$HOME" PATH="$PATH" VJOBS=2 OPENBLAS_NUM_THREADS=2 python3 vtl/benchmarks/vs_numpy/numpy_matmul_baseline.py
            env HOME="$HOME" PATH="$PATH" VJOBS=2 OPENBLAS_NUM_THREADS=2 python3 vtl/benchmarks/vs_numpy/numpy_matmul_f32_end_to_end.py
            run_v_benchmark vtl-conv2d vtl/benchmarks/vs_numpy/conv2d_bench.v
            echo '## Reduced SVD vs NumPy'
            run_v_benchmark vtl-svd-purev vtl/benchmarks/vs_numpy/svd_bench.v
            run_v_benchmark vtl-svd-lapacke vtl/benchmarks/vs_numpy/svd_bench.v -d vsl_lapack_lapacke
            env HOME="$HOME" PATH="$PATH" VJOBS=2 OPENBLAS_NUM_THREADS=2 python3 vtl/benchmarks/vs_numpy/numpy_svd_baseline.py
            echo '## Contiguous sum and mean'
            run_v_benchmark vtl-stats vtl/benchmarks/vs_numpy/stats_bench.v
            env HOME="$HOME" PATH="$PATH" VJOBS=2 OPENBLAS_NUM_THREADS=2 python3 vtl/benchmarks/vs_numpy/numpy_stats_baseline.py
            echo '## Linear bias gradient reduction'
            run_v_benchmark vtl-linear-bias-purev vtl/benchmarks/linear_bias_reduction_bench.v
            run_v_benchmark vtl-linear-bias-openblas vtl/benchmarks/linear_bias_reduction_bench.v -d vsl_blas_cblas
            env HOME="$HOME" PATH="$PATH" VJOBS=2 OPENBLAS_NUM_THREADS=2 python3 vtl/benchmarks/vs_numpy/numpy_linear_bias_reduction_baseline.py
          } 2>&1 | tee vs_numpy_pr.md

      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: vtl-vs-numpy
          path: ~/.vmodules/vs_numpy_pr.md
