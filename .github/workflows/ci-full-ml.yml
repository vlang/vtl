name: CI Full ML (optional)

env:
  VJOBS: '2'

# Heavy compile: full `v test vtl` + `examples/nn_cifar10/main.v`.
# Default PRs use scoped `bin/test` in ci.yml to avoid OOM.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 0'
  pull_request:
    types: [labeled]

concurrency:
  group: full-ml-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-ml:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'full-ml')
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      TERM: xterm
      VJOBS: '2'

    steps:
      - uses: actions/checkout@v4
        id: uses_checkout_v4
        with:
          path: vtl

      - uses: actions/checkout@v4
        id: uses_checkout_v4_2
        if: ${{ !cancelled() && steps.uses_checkout_v4.outcome == 'success' }}
        with:
          repository: vlang/vsl
          path: vsl

      - uses: vlang/setup-v@663cc08827d1fc0532ee755b4dedbb183c11d06a # v1.7
        id: uses_setup_v_663cc08827d1fc0532ee755b4dedbb183c11d06a_v1_7
        if: ${{ !cancelled() && steps.uses_checkout_v4_2.outcome == 'success' }}
        with:
          check-latest: true

      - name: Install dependencies
        id: install_dependencies
        if: ${{ !cancelled() && steps.uses_setup_v_663cc08827d1fc0532ee755b4dedbb183c11d06a_v1_7.outcome == 'success' }}
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install \
            gfortran liblapacke-dev libopenblas-dev libgc-dev \
            libgl1-mesa-dev opencl-headers

      - name: Install VTL module
        id: install_vtl_module
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: |
          mkdir -p ~/.vmodules
          mv ./vtl ~/.vmodules/vtl
          mv ./vsl ~/.vmodules/vsl

      - name: Full test tree and examples
        id: full_test_tree_and_examples
        if: ${{ !cancelled() && steps.install_vtl_module.outcome == 'success' }}
        run: |
          cd ~/.vmodules
          env HOME="$HOME" PATH="$PATH" VJOBS=2 TERM="$TERM" \
            "$HOME/.vmodules/vtl/bin/test" --full
